Metrics/MethodLength:
  Max: 100

Metrics/BlockLength:
  Max: 100
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'
    - 'config/routes.rb'

Layout/LineLength:
  Enabled: false

Metrics/ClassLength:
  Max: 150

Metrics/ModuleLength:
  Max: 15000

Metrics/CyclomaticComplexity:
  Max: 100

Metrics/PerceivedComplexity:
  Max: 100

Metrics/AbcSize:
  Max: 250

Metrics/ParameterLists:
  Max: 5